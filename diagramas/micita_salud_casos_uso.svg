<svg width="1700" height="1080" viewBox="0 0 1700 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#444444" stroke-width="1.4"/>
    </marker>
    <marker id="triangle" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M1,1 L15,8 L1,15 Z" fill="white" stroke="black" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1080" fill="white"/>

  <!-- ===================== FRONTERA DEL SISTEMA ===================== -->
  <rect x="300" y="40" width="1120" height="940" rx="14" fill="#FAFAFA" stroke="black" stroke-width="1.8"/>
  <text x="860" y="72" text-anchor="middle" font-size="20" font-weight="bold">Sistema «MiCita Salud»</text>

  <!-- ===================== CASOS DE USO (elipses) ===================== -->
  <!-- UC1 -->
  <ellipse cx="500" cy="120" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="500" y="120" text-anchor="middle" font-size="13"><tspan x="500" dy="-6">Registrarse en la</tspan><tspan x="500" dy="16">plataforma</tspan></text>

  <!-- UC2 -->
  <ellipse cx="760" cy="120" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="760" y="125" text-anchor="middle" font-size="13">Autenticar identidad</text>

  <!-- UC3 -->
  <ellipse cx="1060" cy="120" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="1060" y="120" text-anchor="middle" font-size="13"><tspan x="1060" dy="-6">Consultar disponibilidad</tspan><tspan x="1060" dy="16">de agenda</tspan></text>

  <!-- UC4 -->
  <ellipse cx="500" cy="250" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="500" y="255" text-anchor="middle" font-size="13">Solicitar cita</text>

  <!-- UC5 -->
  <ellipse cx="760" cy="250" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="760" y="255" text-anchor="middle" font-size="13">Cancelar cita</text>

  <!-- UC6 -->
  <ellipse cx="1000" cy="250" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="1000" y="255" text-anchor="middle" font-size="13">Reprogramar cita</text>

  <!-- UC7 -->
  <ellipse cx="1260" cy="250" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="1260" y="250" text-anchor="middle" font-size="13"><tspan x="1260" dy="-6">Adjuntar resultados</tspan><tspan x="1260" dy="16">de exámenes</tspan></text>

  <!-- UC8 -->
  <ellipse cx="500" cy="380" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="500" y="385" text-anchor="middle" font-size="13">Confirmar cita</text>

  <!-- UC9 -->
  <ellipse cx="760" cy="380" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="760" y="385" text-anchor="middle" font-size="13">Procesar pago</text>

  <!-- UC10 -->
  <ellipse cx="500" cy="520" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="500" y="520" text-anchor="middle" font-size="13"><tspan x="500" dy="-6">Consultar agenda</tspan><tspan x="500" dy="16">diaria</tspan></text>

  <!-- UC11 -->
  <ellipse cx="760" cy="520" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="760" y="520" text-anchor="middle" font-size="13"><tspan x="760" dy="-6">Registrar evolución</tspan><tspan x="760" dy="16">de consulta</tspan></text>

  <!-- UC12 -->
  <ellipse cx="1000" cy="520" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="1000" y="520" text-anchor="middle" font-size="13"><tspan x="1000" dy="-6">Generar órdenes</tspan><tspan x="1000" dy="16">médicas</tspan></text>

  <!-- UC13 -->
  <ellipse cx="1260" cy="520" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="1260" y="520" text-anchor="middle" font-size="13"><tspan x="1260" dy="-6">Consultar historia</tspan><tspan x="1260" dy="16">clínica</tspan></text>

  <!-- UC14 -->
  <ellipse cx="500" cy="680" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="500" y="680" text-anchor="middle" font-size="13"><tspan x="500" dy="-6">Administrar agendas</tspan><tspan x="500" dy="16">de profesionales</tspan></text>

  <!-- UC15 -->
  <ellipse cx="780" cy="680" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="780" y="680" text-anchor="middle" font-size="13"><tspan x="780" dy="-6">Habilitar/bloquear</tspan><tspan x="780" dy="16">franjas horarias</tspan></text>

  <!-- UC16 -->
  <ellipse cx="1060" cy="680" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="1060" y="680" text-anchor="middle" font-size="13"><tspan x="1060" dy="-6">Generar reportes de</tspan><tspan x="1060" dy="16">asistencia</tspan></text>

  <!-- UC17 -->
  <ellipse cx="1060" cy="800" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="1060" y="800" text-anchor="middle" font-size="13"><tspan x="1060" dy="-6">Enviar notificación</tspan><tspan x="1060" dy="16">de recordatorio</tspan></text>

  <!-- UC18 -->
  <ellipse cx="500" cy="920" rx="100" ry="34" fill="white" stroke="black" stroke-width="1.3"/>
  <text x="500" y="920" text-anchor="middle" font-size="13"><tspan x="500" dy="-6">Gestionar usuarios</tspan><tspan x="500" dy="16">y roles</tspan></text>

  <!-- ===================== ACTORES PRIMARIOS (izquierda) ===================== -->
  <!-- A1 Paciente -->
  <g>
    <circle cx="190" cy="55" r="13" fill="white" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="68" x2="190" y2="105" stroke="black" stroke-width="1.5"/>
    <line x1="170" y1="80" x2="210" y2="80" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="105" x2="174" y2="138" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="105" x2="206" y2="138" stroke="black" stroke-width="1.5"/>
    <text x="190" y="158" text-anchor="middle" font-size="13" font-weight="bold">Paciente</text>
  </g>

  <!-- A2 Paciente afiliado -->
  <g>
    <circle cx="190" cy="205" r="13" fill="white" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="218" x2="190" y2="255" stroke="black" stroke-width="1.5"/>
    <line x1="170" y1="230" x2="210" y2="230" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="255" x2="174" y2="288" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="255" x2="206" y2="288" stroke="black" stroke-width="1.5"/>
    <text x="190" y="308" text-anchor="middle" font-size="13">Paciente afiliado</text>
  </g>

  <!-- A3 Paciente particular (desplazado a la izquierda) -->
  <g>
    <circle cx="130" cy="355" r="13" fill="white" stroke="black" stroke-width="1.5"/>
    <line x1="130" y1="368" x2="130" y2="405" stroke="black" stroke-width="1.5"/>
    <line x1="110" y1="380" x2="150" y2="380" stroke="black" stroke-width="1.5"/>
    <line x1="130" y1="405" x2="114" y2="438" stroke="black" stroke-width="1.5"/>
    <line x1="130" y1="405" x2="146" y2="438" stroke="black" stroke-width="1.5"/>
    <text x="130" y="458" text-anchor="middle" font-size="13">Paciente particular</text>
  </g>

  <!-- A4 Médico -->
  <g>
    <circle cx="190" cy="505" r="13" fill="white" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="518" x2="190" y2="555" stroke="black" stroke-width="1.5"/>
    <line x1="170" y1="530" x2="210" y2="530" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="555" x2="174" y2="588" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="555" x2="206" y2="588" stroke="black" stroke-width="1.5"/>
    <text x="190" y="608" text-anchor="middle" font-size="13" font-weight="bold">Médico</text>
  </g>

  <!-- A5 Auxiliar administrativo -->
  <g>
    <circle cx="190" cy="665" r="13" fill="white" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="678" x2="190" y2="715" stroke="black" stroke-width="1.5"/>
    <line x1="170" y1="690" x2="210" y2="690" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="715" x2="174" y2="748" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="715" x2="206" y2="748" stroke="black" stroke-width="1.5"/>
    <text x="190" y="768" text-anchor="middle" font-size="13" font-weight="bold"><tspan x="190" dy="0">Auxiliar</tspan><tspan x="190" dy="16">administrativo</tspan></text>
  </g>

  <!-- A6 Administrador del sistema -->
  <g>
    <circle cx="190" cy="845" r="13" fill="white" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="858" x2="190" y2="895" stroke="black" stroke-width="1.5"/>
    <line x1="170" y1="870" x2="210" y2="870" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="895" x2="174" y2="928" stroke="black" stroke-width="1.5"/>
    <line x1="190" y1="895" x2="206" y2="928" stroke="black" stroke-width="1.5"/>
    <text x="190" y="948" text-anchor="middle" font-size="13" font-weight="bold"><tspan x="190" dy="0">Administrador</tspan><tspan x="190" dy="16">del sistema</tspan></text>
  </g>

  <!-- ===================== ACTORES SECUNDARIOS / SISTEMAS EXTERNOS (derecha) ===================== -->
  <!-- B1 Pasarela de pagos -->
  <g>
    <circle cx="1530" cy="325" r="13" fill="#F0F0F0" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="338" x2="1530" y2="375" stroke="black" stroke-width="1.5"/>
    <line x1="1510" y1="350" x2="1550" y2="350" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="375" x2="1514" y2="408" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="375" x2="1546" y2="408" stroke="black" stroke-width="1.5"/>
    <text x="1530" y="428" text-anchor="middle" font-size="13"><tspan x="1530" dy="0">Pasarela de</tspan><tspan x="1530" dy="16">pagos</tspan></text>
  </g>

  <!-- B2 Sistema HIS -->
  <g>
    <circle cx="1530" cy="465" r="13" fill="#F0F0F0" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="478" x2="1530" y2="515" stroke="black" stroke-width="1.5"/>
    <line x1="1510" y1="490" x2="1550" y2="490" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="515" x2="1514" y2="548" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="515" x2="1546" y2="548" stroke="black" stroke-width="1.5"/>
    <text x="1530" y="568" text-anchor="middle" font-size="13">Sistema HIS</text>
  </g>

  <!-- B3 Servicio de mensajería -->
  <g>
    <circle cx="1530" cy="745" r="13" fill="#F0F0F0" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="758" x2="1530" y2="795" stroke="black" stroke-width="1.5"/>
    <line x1="1510" y1="770" x2="1550" y2="770" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="795" x2="1514" y2="828" stroke="black" stroke-width="1.5"/>
    <line x1="1530" y1="795" x2="1546" y2="828" stroke="black" stroke-width="1.5"/>
    <text x="1530" y="848" text-anchor="middle" font-size="13"><tspan x="1530" dy="0">Servicio de</tspan><tspan x="1530" dy="16">mensajería</tspan></text>
  </g>

  <!-- ===================== ASOCIACIONES (línea continua) ===================== -->
  <!-- Paciente -> casos de uso compartidos -->
  <line x1="204" y1="90" x2="400" y2="125" stroke="black" stroke-width="1"/>
  <line x1="203" y1="98" x2="660" y2="135" stroke="black" stroke-width="1"/>
  <line x1="204" y1="105" x2="960" y2="140" stroke="black" stroke-width="1"/>
  <line x1="204" y1="115" x2="400" y2="235" stroke="black" stroke-width="1"/>
  <line x1="204" y1="120" x2="660" y2="245" stroke="black" stroke-width="1"/>
  <line x1="204" y1="125" x2="900" y2="255" stroke="black" stroke-width="1"/>

  <!-- Paciente particular -> Confirmar cita -->
  <line x1="144" y1="390" x2="400" y2="384" stroke="black" stroke-width="1"/>

  <!-- Médico -> sus casos de uso -->
  <line x1="204" y1="490" x2="400" y2="515" stroke="black" stroke-width="1"/>
  <line x1="204" y1="500" x2="660" y2="522" stroke="black" stroke-width="1"/>
  <line x1="204" y1="510" x2="900" y2="525" stroke="black" stroke-width="1"/>

  <!-- Auxiliar administrativo -> sus casos de uso -->
  <line x1="204" y1="650" x2="400" y2="675" stroke="black" stroke-width="1"/>
  <line x1="204" y1="662" x2="680" y2="682" stroke="black" stroke-width="1"/>
  <line x1="204" y1="675" x2="960" y2="685" stroke="black" stroke-width="1"/>

  <!-- Administrador -> Gestionar usuarios y roles -->
  <line x1="204" y1="835" x2="410" y2="895" stroke="black" stroke-width="1"/>

  <!-- Pasarela de pagos -> Procesar pago -->
  <line x1="1503" y1="365" x2="860" y2="380" stroke="black" stroke-width="1"/>

  <!-- Sistema HIS -> Consultar historia clínica -->
  <line x1="1503" y1="500" x2="1360" y2="515" stroke="black" stroke-width="1"/>

  <!-- Servicio de mensajería -> Enviar notificación -->
  <line x1="1503" y1="785" x2="1160" y2="800" stroke="black" stroke-width="1"/>

  <!-- ===================== GENERALIZACIÓN (triángulo hueco) ===================== -->
  <line x1="190" y1="192" x2="190" y2="152" stroke="black" stroke-width="1.4" marker-end="url(#triangle)"/>
  <line x1="130" y1="342" x2="185" y2="153" stroke="black" stroke-width="1.4" marker-end="url(#triangle)"/>

  <!-- ===================== «include» (línea punteada, flecha abierta) ===================== -->
  <!-- Solicitar cita -> Autenticar identidad -->
  <line x1="560" y1="222" x2="700" y2="150" stroke="#444444" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#openArrow)"/>
  <text x="660" y="200" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">«include»</text>

  <!-- Registrar evolución de consulta -> Consultar historia clínica -->
  <path d="M 795,488 Q 1030,415 1225,488" fill="none" stroke="#444444" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#openArrow)"/>
  <text x="1010" y="430" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">«include»</text>

  <!-- Gestionar usuarios y roles -> Autenticar identidad (canal por el margen izquierdo interior) -->
  <path d="M 400,895 L 350,895 L 350,120 L 660,120" fill="none" stroke="#444444" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#openArrow)"/>
  <text x="358" y="510" font-size="11" font-style="italic" fill="#444444" transform="rotate(-90, 358, 510)">«include»</text>

  <!-- ===================== «extend» (línea punteada, flecha abierta) ===================== -->
  <!-- Adjuntar resultados de exámenes -> Solicitar cita -->
  <path d="M 1180,216 Q 800,140 420,216" fill="none" stroke="#444444" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#openArrow)"/>
  <text x="800" y="165" text-anchor="middle" font-size="11" font-style="italic" fill="#444444">«extend»</text>

  <!-- ===================== LEYENDA ===================== -->
  <g>
    <rect x="1170" y="920" width="440" height="120" fill="white" stroke="black" stroke-width="1"/>
    <text x="1185" y="942" font-size="13" font-weight="bold">Leyenda</text>
    <line x1="1185" y1="962" x2="1225" y2="962" stroke="black" stroke-width="1"/>
    <text x="1235" y="966" font-size="12">Asociación / generalización (línea continua)</text>
    <line x1="1185" y1="986" x2="1225" y2="986" stroke="#444444" stroke-width="1.3" stroke-dasharray="6,5" marker-end="url(#openArrow)"/>
    <text x="1235" y="990" font-size="12">«include» / «extend» (línea punteada, flecha abierta)</text>
    <path d="M1185,1010 L1215,1010" stroke="black" stroke-width="1.4" marker-end="url(#triangle)"/>
    <text x="1235" y="1014" font-size="12">Generalización entre actores (triángulo hueco)</text>
  </g>

</svg>
